[project]
name = "market_scout"
version = "0.1.0"
description = "market-scout using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4",
    "pandas>=2.3.3",
    "streamlit>=1.64.0",
    "yfinance>=1.7.0",
]

[project.scripts]
market_scout = "market_scout.main:run"
run_crew = "market_scout.main:run"
train = "market_scout.main:train"
replay = "market_scout.main:replay"
test = "market_scout.main:test"
run_with_trigger = "market_scout.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
